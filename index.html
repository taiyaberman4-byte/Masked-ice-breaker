<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masked Voice Party Game</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; margin: 0; padding: 30px; }
        .card { background: #1e293b; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        input, select, button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 6px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #334155; color: white; }
        button { background: #6366f1; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #4f46e5; }
        button.danger { background: #ef4444; }
        .hidden { display: none !important; }
        ul { list-style: none; padding: 0; text-align: left; }
        li { background: #334155; margin-top: 8px; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎭 Masked Voice Game</h1>
        <p id="roundIndicator" style="color: #38bdf8; font-weight: bold;"></p>
        
        <!-- Login Screen -->
        <div id="login-screen">
            <p>Enter your details to join the game:</p>
            <input type="text" id="realNameInput" placeholder="Your Real Name (Hidden until the end)">
            <input type="text" id="codenameInput" placeholder="Secret Codename (e.g. Ghost)">
            <button onclick="joinGame()">Join Lobby</button>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="hidden">
            <h2>Waiting Room</h2>
            <ul id="playerList"></ul>
            <button id="startBtn" class="hidden" onclick="startGameSession()">Start Multi-Round Game</button>
        </div>

        <!-- Game Play Screen -->
        <div id="game-screen" class="hidden">
            <h2 id="gameTitle">Game in Progress</h2>
            <div id="speakerSection" class="hidden">
                <p>You are the speaker this round! Record your high-pitched alien message:</p>
                <button id="recBtn" onclick="toggleRecording()">🔴 Start Recording</button>
                <p id="recStatus"></p>
            </div>
            <div id="listenerSection" class="hidden">
                <p>Listen to the masked alien voice:</p>
                <audio id="audioPlayback" controls style="width:100%; margin-top:15px;"></audio>
                <p>Who spoke this?</p>
                <select id="guessSelect"></select>
                <button onclick="submitGuess()">Submit Guess</button>
            </div>
        </div>

        <!-- Reveal Screen -->
        <div id="reveal-screen" class="hidden">
            <h2>🎉 Round Reveal!</h2>
            <p id="revealText" style="font-size: 18px; margin: 20px 0;"></p>
            <button id="nextRoundBtn" class="hidden" onclick="nextRound()">Next Round ➡️</button>
            <button id="restartGameBtn" class="hidden" onclick="location.reload()">Play Entire Game Again</button>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCriql3I26apEE5QzIPabsOMApnA4cx0xY",
        authDomain: "masked-voices-3b874.firebaseapp.com",
        databaseURL: "https://masked-voices-3b874-default-rtdb.firebaseio.com",
        projectId: "masked-voices-3b874",
        storageBucket: "masked-voices-3b874.appspot.com",
        messagingSenderId: "465930077064",
        appId: "1:465930077064:web:b56eab39e09cc8d5adb03d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myId = 'user_' + Math.random().toString(36).substring(2, 9);
    let myData = {};
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let audioCtx;

    function joinGame() {
        const realName = document.getElementById('realNameInput').value.trim();
        const codename = document.getElementById('codenameInput').value.trim();
        if (!realName || !codename) { alert('Fill in both fields!'); return; }

        myData = { realName, codename };
        
        db.ref('players/' + myId).set(myData);
        db.ref('players/' + myId).onDisconnect().remove();

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('lobby-screen').classList.remove('hidden');

        listenToGameState();
    }

    function listenToGameState() {
        db.ref('players').on('value', snapshot => {
            const players = snapshot.val() || {};
            const list = document.getElementById('playerList');
            list.innerHTML = '';
            
            const playerIds = Object.keys(players);
            let isFirst = playerIds[0] === myId;

            for (let id in players) {
                const li = document.createElement('li');
                li.innerText = players[id].codename + (id === playerIds[0] ? ' (Host)' : '');
                list.appendChild(li);
            }

            if (isFirst && playerIds.length >= 1) {
                document.getElementById('startBtn').classList.remove('hidden');
            }
        });

        db.ref('gameState').on('value', snapshot => {
            const state = snapshot.val();
            if (!state) return;

            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('roundIndicator').innerText = `Round ${state.currentRound} of ${state.totalRounds}`;

            if (myId === state.speakerId) {
                document.getElementById('gameTitle').innerText = "Your Turn to Speak!";
                document.getElementById('speakerSection').classList.remove('hidden');
                document.getElementById('listenerSection').classList.add('hidden');
                setupRecorder();
            } else {
                document.getElementById('gameTitle').innerText = "Listen & Guess!";
                document.getElementById('speakerSection').classList.add('hidden');
                document.getElementById('listenerSection').classList.remove('hidden');
                loadGuessOptions();
            }

            if (state.audioData) {
                document.getElementById('audioPlayback').src = state.audioData;
            }

            if (state.reveal) {
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('reveal-screen').classList.remove('hidden');
                document.getElementById('revealText').innerHTML = `
                    The speaker was <b>${state.speakerCodename}</b>!<br>
                    Real name: <span style="color:#38bdf8;"><b>${state.speakerRealName}</b></span>
                `;

                if (myId === state.hostId) {
                    if (state.currentRound < state.totalRounds) {
                        document.getElementById('nextRoundBtn').classList.remove('hidden');
                    } else {
                        document.getElementById('restartGameBtn').classList.remove('hidden');
                        document.getElementById('revealText').innerHTML += `<br><br><b>Game Over! All rounds complete!</b>`;
                    }
                }
            }
        });
    }

    async function startGameSession() {
        const pSnap = await db.ref('players').once('value');
        const players = pSnap.val();
        const ids = Object.keys(players);

        db.ref('gameState').set({
            hostId: myId,
            playerOrder: ids,
            currentRound: 1,
            totalRounds: ids.length,
            speakerId: ids[0],
            speakerCodename: players[ids[0]].codename,
            speakerRealName: players[ids[0]].realName,
            audioData: null,
            reveal: false
        });
    }

    async function nextRound() {
        const stateSnap = await db.ref('gameState').once('value');
        const state = stateSnap.val();
        const pSnap = await db.ref('players').once('value');
        const players = pSnap.val();

        let nextRoundNum = state.currentRound + 1;
        let nextSpeakerIndex = nextRoundNum - 1;
        let nextSpeakerId = state.playerOrder[nextSpeakerIndex];

        db.ref('gameState').update({
            currentRound: nextRoundNum,
            speakerId: nextSpeakerId,
            speakerCodename: players[nextSpeakerId].codename,
            speakerRealName: players[nextSpeakerId].realName,
            audioData: null,
            reveal: false
        });
    }

    async function setupRecorder() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            const source = audioCtx.createMediaStreamSource(stream);

            // Alien Voice Processor Pipeline
            const highPass = audioCtx.createBiquadFilter();
            highPass.type = "highpass";
            highPass.frequency.value = 600; // Cuts deep bass/rumble

            const bandPass = audioCtx.createBiquadFilter();
            bandPass.type = "bandpass";
            bandPass.frequency.value = 2200; // Highlights speech intelligibility range
            bandPass.Q.value = 2;

            // Frequency modulator to give it an electronic sci-fi ring
            const modulator = audioCtx.createOscillator();
            modulator.type = 'sine';
            modulator.frequency.value = 40; 

            const modGain = audioCtx.createGain();
            modGain.gain.value = 150;

            modulator.connect(modGain);
            modGain.connect(bandPass.frequency);
            modulator.start();

            const destination = audioCtx.createMediaStreamDestination();
            
            source.connect(highPass);
            highPass.connect(bandPass);
            bandPass.connect(destination);

            mediaRecorder = new MediaRecorder(destination.stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: "audio/webm" });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    db.ref('gameState/audioData').set(reader.result);
                    document.getElementById('recStatus').innerText = "Alien voice uploaded successfully!";
                };
            };
        } catch (err) { alert("Microphone access is required!"); }
    }

    function toggleRecording() {
        const btn = document.getElementById('recBtn');
        if (!isRecording) {
            audioChunks = [];
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            mediaRecorder.start();
            isRecording = true;
            btn.innerText = "⏹ Stop & Upload Recording";
            btn.classList.add('danger');
            document.getElementById('recStatus').innerText = "Recording...";
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.classList.add('hidden');
        }
    }

    function loadGuessOptions() {
        db.ref('players').once('value', snapshot => {
            const players = snapshot.val() || {};
            const select = document.getElementById('guessSelect');
            select.innerHTML = '';
            for (let id in players) {
                if (id !== myId) {
                    const opt = document.createElement('option');
                    opt.value = players[id].codename;
                    opt.innerText = players[id].codename;
                    select.appendChild(opt);
                }
            }
        });
    }

    function submitGuess() {
        db.ref('gameState/reveal').set(true);
    }
</script>
</body>
</html>
